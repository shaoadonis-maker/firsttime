name: Reels Studio

on:
  push:
    paths: ["reels_studio/**", "tests/**", "launcher/**", ".github/workflows/reels-studio.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - name: Install kit, media packages and font with the app's installers
        run: python tests/ci_prepare.py ci-workspace
      - name: End-to-end export through the HTTP API
        env:
          REELS_TEST_WORKSPACE: ci-workspace
          PYTHONUTF8: "1"
        run: |
          python -m pip install pytest
          python -m pytest tests -v
      - name: Upload the exported Reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.os }}
          path: ci-workspace/videos/_INBOX/*/*/_out/current.mp4
          if-no-files-found: ignore
